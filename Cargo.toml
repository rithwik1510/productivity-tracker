[workspace]
resolver = "3"
members = ["crates/tracker-api", "crates/tracker", "crates/tracker-win", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Versions from plan section 2. specta, tauri-specta and specta-typescript are exact pins:
# they are pre-release and must move together.
[workspace.dependencies]
tracker-api = { path = "crates/tracker-api" }
tracker = { path = "crates/tracker" }
tracker-win = { path = "crates/tracker-win" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
url = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

rusqlite = { version = "0.40", features = ["bundled"] }
jiff = "0.2"

windows = "0.62"
png = "0.18"
windows-registry = "0.6"

tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-build = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
